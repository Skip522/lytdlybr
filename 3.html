    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a56 0%, #ffd3a5 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #ff7f3f 0%, #ff9a56 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(255, 154, 86, 0.3);
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .filters-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(255, 154, 86, 0.2);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #ff9a56;
            background: white;
            color: #ff7f3f;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #ff9a56;
            color: white;
            transform: translateY(-2px);
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .note-card {
            background: #fff9e6;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            border-left: 5px solid #ffb84d;
            animation: noteSlideIn 0.3s ease-out;
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .note-card.completed {
            background: #f0f8f0;
            border-left-color: #4caf50;
            opacity: 0.8;
        }

        .note-card.group-note {
            background: #fff2e6;
            border-left-color: #ff7f3f;
        }

        .note-card.group-note.completed {
            background: #e8f5e8;
            border-left-color: #4caf50;
        }

        @keyframes noteSlideIn {
            from { transform: translateY(20px) rotate(-1deg); opacity: 0; }
            to { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        .note-header {
            display: flex;
            justify-content: between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .note-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .note-title.completed {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .note-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .category-lecture { background: #ff7f3f; }
        .category-homework { background: #ff9a56; }
        .category-exam { background: #ff4444; }
        .category-project { background: #44aa44; }
        .category-other { background: #888; }

        .note-content {
            margin-bottom: 15px;
        }

        .single-task-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: #ff7f3f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .group-progress {
            background: rgba(255, 127, 63, 0.1);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #ff7f3f;
            font-weight: 500;
        }

        .subtasks-list {
            list-style: none;
            margin-top: 10px;
        }

        .subtasks-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 0.9rem;
        }

        .subtasks-list li:last-child {
            border-bottom: none;
        }

        .subtask-checkbox {
            width: 16px;
            height: 16px;
            accent-color: #ff7f3f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .subtask-text {
            flex: 1;
        }

        .subtask-text.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .note-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .note-date {
            font-size: 0.8rem;
            color: #666;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff7f3f 0%, #ff9a56 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 127, 63, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 127, 63, 0.6);
        }

        .fab:active {
            transform: scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-out;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-title {
            font-size: 1.5rem;
            color: #ff7f3f;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #f0f0f0;
            color: #ff7f3f;
        }

        .task-type-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .task-type-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .task-type-card:hover {
            border-color: #ff9a56;
            background: #fff5f0;
            transform: translateY(-2px);
        }

        .task-type-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }

        .task-type-title {
            font-weight: bold;
            color: #ff7f3f;
            margin-bottom: 5px;
        }

        .task-type-desc {
            font-size: 0.9rem;
            color: #666;
        }

        .task-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #ff9a56;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .task-input:focus {
            border-color: #ff7f3f;
            box-shadow: 0 0 0 3px rgba(255, 154, 86, 0.2);
        }

        .category-select {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ff9a56;
            border-radius: 25px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            outline: none;
            margin-bottom: 15px;
        }

        .group-title-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #ff9a56;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            margin-bottom: 15px;
        }

        .subtask-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .subtask-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 0.9rem;
            outline: none;
        }

        .add-subtask-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .subtask-preview {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid #ff9a56;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .subtask-item:last-child {
            border-bottom: none;
        }

        .remove-subtask {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .add-btn {
            background: linear-gradient(135deg, #ff7f3f 0%, #ff9a56 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 127, 63, 0.4);
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            box-shadow: 0 5px 20px rgba(255, 154, 86, 0.2);
            margin-bottom: 30px;
        }

        .stat-item {
            color: #ff7f3f;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .no-tasks {
            text-align: center;
            color: #999;
            font-size: 1.2rem;
            padding: 50px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(255, 154, 86, 0.2);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .expand-toggle {
            background: none;
            border: none;
            color: #ff7f3f;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .expand-toggle:hover {
            background: rgba(255, 127, 63, 0.1);
        }

        .subtasks-collapsed {
            max-height: 60px;
            overflow: hidden;
            position: relative;
        }

        .subtasks-collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(transparent, #fff2e6);
        }

        @media (max-width: 768px) {
            .tasks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .filters {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 5px;
            }
            
            .filter-btn {
                flex-shrink: 0;
            }
            
            .task-type-selection {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Дневдник</h1>
            
        </div>

        <div class="filters-container">
            <div class="filters">
                <button class="filter-btn active" onclick="filterTasks('all')">Все</button>
                <button class="filter-btn" onclick="filterTasks('active')">Активные</button>
                <button class="filter-btn" onclick="filterTasks('completed')">Завершенные</button>
                <button class="filter-btn" onclick="filterTasks('lecture')">Лекции</button>
                <button class="filter-btn" onclick="filterTasks('homework')">ДЗ</button>
                <button class="filter-btn" onclick="filterTasks('exam')">Экзамены</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Всего задач</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="completedTasks">0</span>
                <span class="stat-label">Завершено</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="activeTasks">0</span>
                <span class="stat-label">Активных</span>
            </div>
        </div>

        <div class="tasks-grid" id="tasksContainer">
            <div class="no-tasks">
                <span class="empty-icon">📋</span>
                Пока нет задач. Добавьте свою первую задачу!
            </div>
        </div>

        <!-- Плавающая кнопка добавления -->
        <button class="fab" onclick="openTaskTypeModal()">+</button>

        <!-- Модальное окно выбора типа задачи -->
        <div id="taskTypeModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Выберите тип задачи</h2>
                    <button class="close-btn" onclick="closeModal('taskTypeModal')">&times;</button>
                </div>
                <div class="task-type-selection">
                    <div class="task-type-card" onclick="selectTaskType('single')">
                        <span class="task-type-icon">📝</span>
                        <div class="task-type-title">Простая задача</div>
                        <div class="task-type-desc">Одна задача с чекбоксом</div>
                    </div>
                    <div class="task-type-card" onclick="selectTaskType('group')">
                        <span class="task-type-icon">📋</span>
                        <div class="task-type-title">Группа задач</div>
                        <div class="task-type-desc">Несколько подзадач в одной группе</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Модальное окно добавления простой задачи -->
        <div id="singleTaskModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Добавить простую задачу</h2>
                    <button class="close-btn" onclick="closeModal('singleTaskModal')">&times;</button>
                </div>
                <input type="text" class="task-input" id="singleTaskInput" placeholder="Введите название задачи...">
                <select class="category-select" id="singleCategorySelect">
                    <option value="other">Другое</option>
                    <option value="lecture">Лекция</option>
                    <option value="homework">Домашнее задание</option>
                    <option value="exam">Экзамен</option>
                    <option value="project">Проект</option>
                </select>
                <button class="add-btn" onclick="addSingleTask()">Добавить задачу</button>
            </div>
        </div>

        <!-- Модальное окно добавления группы задач -->
        <div id="groupTaskModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Добавить группу задач</h2>
                    <button class="close-btn" onclick="closeModal('groupTaskModal')">&times;</button>
                </div>
                
                <input type="text" class="group-title-input" id="groupTitleInput" placeholder="Заголовок группы задач...">
                
                <select class="category-select" id="groupCategorySelect">
                    <option value="other">Другое</option>
                    <option value="lecture">Лекция</option>
                    <option value="homework">Домашнее задание</option>
                    <option value="exam">Экзамен</option>
                    <option value="project">Проект</option>
                </select>

                <div class="subtask-input-container">
                    <input type="text" class="subtask-input" id="subtaskInput" placeholder="Добавить подзадачу...">
                    <button class="add-subtask-btn" onclick="addSubtask()">+ Подзадача</button>
                </div>

                <div id="subtaskPreview" class="subtask-preview" style="display: none;">
                    <h4 style="margin-bottom: 10px;">Подзадачи:</h4>
                    <div id="subtaskList"></div>
                </div>

                <button class="add-btn" onclick="addTaskGroup()">Создать группу задач</button>
            </div>
        </div>
    </div>

    <script>
        let tasks = [];
        let currentFilter = 'all';
        let tempSubtasks = [];

        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                const swCode = `
const CACHE_NAME = 'university-todo-v1';
const urlsToCache = [
  './',
  './index.html'
];

self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME)
      .then(cache => {
        return cache.addAll(urlsToCache);
      })
  );
});

self.addEventListener('fetch', event => {
  event.respondWith(
    caches.match(event.request)
      .then(response => {
        if (response) {
          return response;
        }
        return fetch(event.request);
      }
    )
  );
});
`;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Загрузка задач при загрузке страницы
        window.onload = function() {
            loadTasks();
            renderTasks();
            updateStats();
        };

        // Сохранение в localStorage
        function saveTasks() {
            try {
                localStorage.setItem('universityTasks', JSON.stringify(tasks));
            } catch (e) {
                console.log('Unable to save to localStorage');
            }
        }

        // Загрузка из localStorage
        function loadTasks() {
            try {
                const saved = localStorage.getItem('universityTasks');
                if (saved) {
                    tasks = JSON.parse(saved);
                }
            } catch (e) {
                console.log('Unable to load from localStorage');
            }
        }

        // Обработчики Enter для всех полей ввода
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (e.target.id === 'singleTaskInput') {
                    addSingleTask();
                } else if (e.target.id === 'subtaskInput') {
                    addSubtask();
                }
            }
        });

        // Закрытие модального окна при клике вне его
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                closeModal(e.target.id);
            }
        });

        function openTaskTypeModal() {
            const modal = document.getElementById('taskTypeModal');
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function selectTaskType(type) {
            closeModal('taskTypeModal');
            
            setTimeout(() => {
                if (type === 'single') {
                    const modal = document.getElementById('singleTaskModal');
                    modal.style.display = 'flex';
                    setTimeout(() => {
                        modal.classList.add('show');
                        document.getElementById('singleTaskInput').focus();
                    }, 10);
                } else if (type === 'group') {
                    const modal = document.getElementById('groupTaskModal');
                    modal.style.display = 'flex';
                    setTimeout(() => {
                        modal.classList.add('show');
                        document.getElementById('groupTitleInput').focus();
                    }, 10);
                }
            }, 300);
        }

        function addSingleTask() {
            const taskInput = document.getElementById('singleTaskInput');
            const categorySelect = document.getElementById('singleCategorySelect');
            
            const taskText = taskInput.value.trim();
            if (taskText === '') return;
            
            const task = {
                id: Date.now(),
                type: 'single',
                text: taskText,
                category: categorySelect.value,
                completed: false,
                createdAt: new Date().toLocaleDateString('ru-RU')
            };
            
            tasks.push(task);
            taskInput.value = '';
            
            saveTasks();
            closeModal('singleTaskModal');
            renderTasks();
            updateStats();
        }

        function addSubtask() {
            const subtaskInput = document.getElementById('subtaskInput');
            const subtaskText = subtaskInput.value.trim();
            
            if (subtaskText === '') return;
            
            tempSubtasks.push({
                id: Date.now() + Math.random(),
                text: subtaskText,
                completed: false
            });
            
            subtaskInput.value = '';
            renderSubtaskPreview();
        }

        function removeSubtask(subtaskId) {
            tempSubtasks = tempSubtasks.filter(st => st.id !== subtaskId);
            renderSubtaskPreview();
        }

        function renderSubtaskPreview() {
            const preview = document.getElementById('subtaskPreview');
            const list = document.getElementById('subtaskList');
            
            if (tempSubtasks.length === 0) {
                preview.style.display = 'none';
                return;
            }
            
            preview.style.display = 'block';
            list.innerHTML = tempSubtasks.map(st => `
                <div class="subtask-item">
                    <span>${st.text}</span>
                    <button class="remove-subtask" onclick="removeSubtask(${st.id})">×</button>
                </div>
            `).join('');
        }

        function addTaskGroup() {
            const titleInput = document.getElementById('groupTitleInput');
            const categorySelect = document.getElementById('groupCategorySelect');
            
            const title = titleInput.value.trim();
            if (title === '' || tempSubtasks.length === 0) {
                alert('Пожалуйста, введите заголовок и добавьте хотя бы одну подзадачу');
                return;
            }
            
            const taskGroup = {
                id: Date.now(),
                type: 'group',
                title: title,
                category: categorySelect.value,
                subtasks: [...tempSubtasks],
                completed: false,
                expanded: true,
                createdAt: new Date().toLocaleDateString('ru-RU')
            };
            
            tasks.push(taskGroup);
            
            // Очистка формы
            titleInput.value = '';
            tempSubtasks = [];
            renderSubtaskPreview();
            
            saveTasks();
            closeModal('groupTaskModal');
            renderTasks();
            updateStats();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
            updateStats();
        }

        function toggleSingleTask(id) {
            const task = tasks.find(task => task.id === id);
            if (task && task.type === 'single') {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        function toggleSubtask(groupId, subtaskId) {
            const group = tasks.find(task => task.id === groupId);
            if (group && group.type === 'group') {
                const subtask = group.subtasks.find(st => st.id === subtaskId);
                if (subtask) {
                    subtask.completed = !subtask.completed;
                    
                    // Проверка завершения всей группы
                    const allCompleted = group.subtasks.every(st => st.completed);
                    group.completed = allCompleted;
                    
                    saveTasks();
                    renderTasks();
                    updateStats();
                }
            }
        }

        function toggleGroupExpand(id) {
            const group = tasks.find(task => task.id === id);
            if (group && group.type === 'group') {
                group.expanded = !group.expanded;
                saveTasks();
                renderTasks();
            }
        }

        function filterTasks(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            
            let filteredTasks = tasks;
            
            if (currentFilter === 'active') {
                filteredTasks = tasks.filter(task => !task.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(task => task.completed);
            } else if (currentFilter !== 'all') {
                filteredTasks = tasks.filter(task => task.category === currentFilter);
            }
            
            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="no-tasks">
                        <span class="empty-icon">📋</span>
                        ${currentFilter === 'all' ? 'Пока нет задач. Добавьте свою первую задачу!' : 'Нет задач в этой категории'}
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredTasks.map(task => {
                if (task.type === 'single') {
                    return `
                        <div class="note-card ${task.completed ? 'completed' : ''}">
                            <div class="note-header">
                                <span class="note-category category-${task.category}">
                                    ${getCategoryName(task.category)}
                                </span>
                            </div>
                            <div class="note-content">
                                <div class="single-task-content">
                                    <input type="checkbox" class="task-checkbox" 
                                           ${task.completed ? 'checked' : ''} 
                                           onchange="toggleSingleTask(${task.id})">
                                    <div class="note-title ${task.completed ? 'completed' : ''}">${task.text}</div>
                                </div>
                            </div>
                            <div class="note-actions">
                                <span class="note-date">${task.createdAt}</span>
                                <button class="delete-btn" onclick="deleteTask(${task.id})">🗑️</button>
                            </div>
                        </div>
                    `;
                } else {
                    const completedCount = task.subtasks.filter(st => st.completed).length;
                    const totalCount = task.subtasks.length;
                    const isExpanded = task.expanded !== false;
                    
                    return `
                        <div class="note-card group-note ${task.completed ? 'completed' : ''}">
                            <div class="note-header">
                                <span class="note-category category-${task.category}">
                                    ${getCategoryName(task.category)}
                                </span>
                            </div>
                            <div class="note-content">
                                <div class="note-title ${task.completed ? 'completed' : ''}">${task.title}</div>
                                <div class="group-progress">
                                    ${task.completed ? '✅' : '📋'} Выполнено: ${completedCount}/${totalCount}
                                    <button class="expand-toggle" onclick="toggleGroupExpand(${task.id})">
                                        ${isExpanded ? '🔼 Свернуть' : '🔽 Развернуть'}
                                    </button>
                                </div>
                                <ul class="subtasks-list ${isExpanded ? '' : 'subtasks-collapsed'}">
                                    ${task.subtasks.map(st => `
                                        <li>
                                            <input type="checkbox" class="subtask-checkbox"
                                                   ${st.completed ? 'checked' : ''}
                                                   onchange="toggleSubtask(${task.id}, ${st.id})">
                                            <span class="subtask-text ${st.completed ? 'completed' : ''}">${st.text}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div class="note-actions">
                                <span class="note-date">${task.createdAt}</span>
                                <button class="delete-btn" onclick="deleteTask(${task.id})">🗑️</button>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        function getCategoryName(category) {
            const names = {
                'lecture': 'Лекция',
                'homework': 'ДЗ',
                'exam': 'Экзамен',
                'project': 'Проект',
                'other': 'Другое'
            };
            return names[category] || 'Другое';
        }

        function updateStats() {
            let totalTasks = 0;
            let completedTasks = 0;
            
            tasks.forEach(task => {
                totalTasks++;
                if (task.completed) completedTasks++;
            });
            
            const activeTasks = totalTasks - completedTasks;
            
            document.getElementById('totalTasks').textContent = totalTasks;
            document.getElementById('completedTasks').textContent = completedTasks;
            document.getElementById('activeTasks').textContent = activeTasks;
        }
    </script>
</body>
</html>
